[project]
name = "hakoniwa"
version = "0.3.0"
description = "Hakoniwa: math-model worlds with AI residents. The world runs on equations; AI is used only for decisions, thoughts and speech."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hakoniwa = "hakoniwa.interface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hakoniwa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
